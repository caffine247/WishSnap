<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WishSnap - Wish List</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f7f7f7; color: #333; }
    .header { background: #E8335A; color: white; padding: 24px 20px 20px; text-align: center; }
    .header h1 { font-size: 28px; font-weight: 800; }
    .header p { font-size: 14px; opacity: 0.85; margin-top: 4px; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px 16px 60px; }
    .loading { text-align: center; padding: 60px 20px; color: #888; font-size: 16px; }
    .error { text-align: center; padding: 60px 20px; color: #E8335A; font-size: 16px; }
    .occasion-badge { display: inline-block; background: #fff0f3; color: #E8335A; border-radius: 20px; padding: 6px 14px; font-size: 13px; font-weight: 700; margin-bottom: 16px; }
    .item-card { background: white; border-radius: 14px; margin-bottom: 12px; overflow: hidden; display: flex; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.07); cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; }
    .item-card:active { transform: scale(0.98); }
    .item-img { width: 80px; height: 80px; object-fit: cover; flex-shrink: 0; }
    .item-img-placeholder { width: 80px; height: 80px; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; }
    .item-body { padding: 12px 14px; flex: 1; }
    .item-name { font-size: 16px; font-weight: 700; }
    .item-category { font-size: 13px; color: #888; margin-top: 2px; text-transform: capitalize; }
    .item-price { font-size: 13px; color: #2e7d32; font-weight: 700; margin-top: 4px; }
    .item-chevron { font-size: 18px; color: #ccc; padding: 0 14px 0 4px; flex-shrink: 0; }
    .empty { text-align: center; padding: 40px 20px; color: #aaa; }
    .footer { text-align: center; margin-top: 32px; font-size: 12px; color: #bbb; }
    .footer span { color: #E8335A; font-weight: 700; }

    /* Detail overlay */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; align-items: flex-end; justify-content: center; }
    .overlay.open { display: flex; }
    .detail-sheet { background: white; border-radius: 24px 24px 0 0; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; padding: 12px 20px 40px; animation: slideUp 0.25s ease; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-handle { width: 40px; height: 4px; background: #ddd; border-radius: 2px; margin: 0 auto 16px; }
    .detail-img { width: 100%; height: 220px; object-fit: cover; border-radius: 14px; margin-bottom: 16px; }
    .detail-name { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .detail-badges { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .badge { background: #f0f0f0; border-radius: 10px; padding: 5px 12px; font-size: 13px; font-weight: 600; color: #555; text-transform: capitalize; }
    .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f0f0; font-size: 15px; }
    .detail-row:last-of-type { border-bottom: none; }
    .detail-label { color: #888; }
    .detail-value { font-weight: 600; color: #111; }
    .detail-price { color: #2e7d32; font-size: 18px; font-weight: 800; }
    .buy-button { display: block; width: 100%; margin-top: 20px; background: #E8335A; color: white; border: none; border-radius: 14px; padding: 16px; font-size: 16px; font-weight: 700; text-align: center; text-decoration: none; cursor: pointer; }
    .search-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
    .search-btn { display: block; text-align: center; padding: 10px 4px; border: 1.5px solid #eee; border-radius: 10px; font-size: 13px; font-weight: 600; color: #333; text-decoration: none; }
    .close-btn { display: block; width: 100%; margin-top: 12px; background: none; border: 1.5px solid #eee; border-radius: 14px; padding: 14px; font-size: 15px; color: #888; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎁 WishSnap</h1>
    <p id="subtitle">Loading wish list...</p>
  </div>
  <div class="container">
    <div class="loading" id="loading">Loading...</div>
    <div id="content" style="display:none"></div>
    <div class="error" id="error" style="display:none">List not found or link has expired.</div>
  </div>
  <div class="footer">Shared via <span>WishSnap</span></div>

  <!-- Item detail overlay -->
  <div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
    <div class="detail-sheet" id="detail-sheet">
      <div class="sheet-handle"></div>
      <div id="detail-content"></div>
    </div>
  </div>

  <script src="/__/firebase/10.12.0/firebase-app-compat.js"></script>
  <script src="/__/firebase/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/__/firebase/init.js"></script>
  <script type="module">
    import { getFirestore, collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
    import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';

    const app = getApps()[0];
    const db = getFirestore(app);

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    let allItems = [];

    window.handleOverlayClick = function(e) {
      if (e.target === document.getElementById('overlay')) closeDetail();
    };

    window.closeDetail = function() {
      document.getElementById('overlay').classList.remove('open');
    };

    window.openDetail = function(index) {
      const item = allItems[index];
      if (!item) return;

      const searchQuery = encodeURIComponent(item.name);
      const amazonUrl = `https://www.amazon.com/s?k=${searchQuery}`;
      const walmartUrl = `https://www.walmart.com/search?q=${searchQuery}`;
      const targetUrl = `https://www.target.com/s?searchTerm=${searchQuery}`;
      const buyUrl = item.productUrl || amazonUrl;

      let html = '';

      if (item.imageUri) {
        html += `<img class="detail-img" src="${item.imageUri}" alt="${item.name}" onerror="this.style.display='none'" />`;
      }

      html += `<div class="detail-name">${item.name}</div>`;

      html += `<div class="detail-badges">`;
      if (item.category) html += `<div class="badge">${item.category}</div>`;
      if (item.occasion) {
        const emoji = item.occasion === 'Christmas' ? '🎄' : '🎂';
        html += `<div class="badge">${emoji} ${item.occasion}</div>`;
      }
      html += `</div>`;

      if (item.price) {
        html += `
          <div class="detail-row">
            <span class="detail-label">Price</span>
            <span class="detail-price">$${parseFloat(item.price).toFixed(2)}</span>
          </div>`;
      }

      if (item.retailer) {
        html += `
          <div class="detail-row">
            <span class="detail-label">Retailer</span>
            <span class="detail-value">${item.retailer}</span>
          </div>`;
      }

      if (item.priceDate) {
        const date = new Date(item.priceDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        html += `
          <div class="detail-row">
            <span class="detail-label">Price checked</span>
            <span class="detail-value">${date}</span>
          </div>`;
      }

      html += `<a class="buy-button" href="${buyUrl}" target="_blank">Buy on ${item.retailer || 'Amazon'} →</a>`;

      html += `
        <div class="search-buttons">
          <a class="search-btn" href="${amazonUrl}" target="_blank">Amazon</a>
          <a class="search-btn" href="${walmartUrl}" target="_blank">Walmart</a>
          <a class="search-btn" href="${targetUrl}" target="_blank">Target</a>
        </div>`;

      html += `<button class="close-btn" onclick="closeDetail()">Close</button>`;

      document.getElementById('detail-content').innerHTML = html;
      document.getElementById('overlay').classList.add('open');
    };

    async function loadList() {
      if (!token) { showError(); return; }
      try {
        const q = query(collection(db, 'shares'), where('token', '==', token));
        const snap = await getDocs(q);
        if (snap.empty) { showError(); return; }
        const data = snap.docs[0].data();
        renderList(data);
      } catch (e) {
        showError();
      }
    }

    function renderList(data) {
      document.getElementById('loading').style.display = 'none';
      const content = document.getElementById('content');
      content.style.display = 'block';

      const occasionLabel = data.occasion === 'All' ? 'Wish List' : `${data.occasion} Wish List`;
      const childPrefix = data.childName ? `${data.childName}'s ` : '';
      document.getElementById('subtitle').textContent = `${childPrefix}${occasionLabel}`;
      document.title = `WishSnap - ${childPrefix}${occasionLabel}`;

      if (!data.items || data.items.length === 0) {
        content.innerHTML = '<div class="empty">No items on this list yet!</div>';
        return;
      }

      allItems = data.items;

      const occasionEmoji = data.occasion === 'Christmas' ? '🎄' : data.occasion === 'Birthday' ? '🎂' : '🎁';
      let html = `<div class="occasion-badge">${occasionEmoji} ${childPrefix}${occasionLabel}</div>`;

      data.items.forEach((item, index) => {
        const img = item.imageUri
          ? `<img class="item-img" src="${item.imageUri}" alt="${item.name}" onerror="this.parentElement.querySelector('.item-img-placeholder') && (this.style.display='none')" />`
          : `<div class="item-img-placeholder">🎁</div>`;

        const price = item.price
          ? `<div class="item-price">$${parseFloat(item.price).toFixed(2)} · ${item.retailer || ''}</div>`
          : '';

        html += `
          <div class="item-card" onclick="openDetail(${index})">
            ${img}
            <div class="item-body">
              <div class="item-name">${item.name}</div>
              <div class="item-category">${item.category || ''}</div>
              ${price}
            </div>
            <div class="item-chevron">›</div>
          </div>`;
      });

      content.innerHTML = html;
    }

    function showError() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
    }

    loadList();
  </script>
</body>
</html>
